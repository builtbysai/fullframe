<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FullFrame recording</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: rgba(16, 20, 28, 0.92);
    color: #e6edf3;
    font: 14px system-ui, sans-serif;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border: 1px solid rgba(248, 113, 113, 0.45);
    border-radius: 14px;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #f87171;
    box-shadow: 0 0 10px #f87171;
    animation: pulse 1.2s ease-in-out infinite;
    flex: none;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  #time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 17px; min-width: 64px; }
  #stopBtn {
    margin-left: auto;
    background: #f87171; color: #10141c;
    border: none; border-radius: 10px;
    font: 600 13px system-ui, sans-serif;
    padding: 10px 18px; cursor: pointer;
    flex: none;
  }
  #stopBtn:hover { background: #fca5a5; }
  #stopBtn:disabled { opacity: 0.5; cursor: wait; }
  #status { font-size: 12px; color: #8b98a9; display: none; }
</style>
</head>
<body data-tauri-drag-region>
  <span class="dot"></span>
  <span id="time">0:00</span>
  <span id="status"></span>
  <button id="stopBtn">Stop</button>
<script>
const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args || {});
const listen = (ev, cb) => window.__TAURI__.event.listen(ev, cb);
const started = Date.now();
let stopping = false;

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
setInterval(() => {
  if (!stopping) document.getElementById('time').textContent = fmt(Date.now() - started);
}, 250);

async function stopFlow() {
  if (stopping) return;
  stopping = true;
  const btn = document.getElementById('stopBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.style.display = 'inline';
  status.textContent = 'Finishing…';
  try {
    const tmpPath = await invoke('stop_recording');
    status.textContent = 'Choose where to save…';
    const dest = await invoke('plugin:dialog|save', {
      defaultPath: 'fullframe-recording.mp4',
      filters: [{ name: 'Video', extensions: ['mp4'] }],
    });
    if (dest) {
      await invoke('save_recording', { src: tmpPath, dest });
    } else {
      await invoke('delete_recording', { path: tmpPath });
    }
  } catch (err) {
    status.textContent = 'Error: ' + (err && err.toString ? err.toString() : err);
    btn.disabled = false;
    stopping = false;
    return;
  }
  window.__TAURI__.window.getCurrentWindow().close();
}

document.getElementById('stopBtn').onclick = stopFlow;
listen('recording_stop_requested', stopFlow);
</script>
</body>
</html>
