<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FullFrame Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="toolbar">
  <div class="group">
    <button data-tool="select" title="Select / move (V)">➤</button>
    <button data-tool="rect" title="Rectangle (R)">▭</button>
    <button data-tool="ellipse" title="Ellipse (E)">○</button>
    <button data-tool="arrow" title="Arrow (A)">↗</button>
    <button data-tool="line" title="Line (L)">╱</button>
    <button data-tool="pen" title="Pen (P)">✎</button>
    <button data-tool="highlight" title="Highlighter (H)">🖍</button>
    <button data-tool="text" title="Text (T)">T</button>
    <button data-tool="step" title="Step number (N)">①</button>
  </div>
  <div class="group">
    <button data-tool="blur" title="Blur region (B)">🌫</button>
    <button data-tool="pixelate" title="Pixelate region (X)">🔳</button>
    <button data-tool="crop" title="Crop (C)">✂</button>
  </div>
  <div class="group colors" id="colors"></div>
  <div class="group">
    <select id="width" title="Line width">
      <option value="2">2px</option>
      <option value="3" selected>3px</option>
      <option value="5">5px</option>
      <option value="8">8px</option>
      <option value="12">12px</option>
    </select>
    <select id="zoom" title="Zoom">
      <option value="0.25">25%</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
      <option value="3">300%</option>
    </select>
  </div>
  <div class="group">
    <button id="undo" title="Undo (Ctrl+Z)">↩</button>
    <button id="redo" title="Redo (Ctrl+Y)">↪</button>
  </div>
  <div class="spacer"></div>
  <div class="group actions">
    <button id="copy" title="Copy to clipboard (Ctrl+C)">📋 Copy</button>
    <button id="pin" title="Pin to screen">📌 Pin</button>
    <button id="save" class="primary" title="Save (Ctrl+S)">💾 Save</button>
  </div>
</div>
<div id="stage">
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <textarea id="textInput" style="display:none"></textarea>
  </div>
  <div id="empty">No capture loaded.</div>
</div>
<div id="status"><span id="dims"></span><span id="selInfo"></span></div>
<script src="shared.js"></script>
<script src="editor.js"></script>
</body>
</html>
