<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FullFrame Pin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #bar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: flex-end; padding: 4px; opacity: 0; transition: opacity 0.2s; background: linear-gradient(rgba(0,0,0,0.5), transparent); }
  body:hover #bar { opacity: 1; }
  #bar button { background: rgba(20,24,31,0.9); color: #fff; border: 1px solid #2c3542; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  #bar button:hover { border-color: #22d3ee; }
</style>
</head>
<body>
<img id="img" alt="">
<div id="bar"><button id="close">✕ Close</button></div>
<script src="shared.js"></script>
<script>
  listen('pin-image', (e) => { document.getElementById('img').src = e.payload.data_url; });
  document.getElementById('close').onclick = () => invoke('close_pin');
</script>
</body>
</html>
